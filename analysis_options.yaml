# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  # Suppress a rule for one line with `// ignore: name_of_lint`, or for a
  # whole file with `// ignore_for_file: name_of_lint`, rather than turning
  # it off for the project here.
  #
  # The rules below are additions to `flutter_lints`. They are grouped by the
  # bug class they exist to catch, because this app's regression history is
  # dominated by async-lifecycle mistakes: streams abandoned mid-flight,
  # poster lookups cancelled before completion, timers outliving the state
  # that owns them.
  rules:
    # --- Async lifecycle: the #1 source of past regressions ---------------
    # A dropped Future is a silent failure that surfaces later as a stuck
    # spinner. Mark deliberate fire-and-forget with `unawaited(...)`.
    unawaited_futures: true
    # The same mistake one level up: a Future discarded in synchronous code
    # (initState, a button callback) and a `void` async function, whose
    # errors nothing can catch. Both slipped past `unawaited_futures`, and
    # several of them used to take the whole app down.
    discarded_futures: true
    avoid_void_async: true
    # Timers, subscriptions and sinks that outlive their owner keep polling
    # against a disposed notifier.
    cancel_subscriptions: true
    close_sinks: true
    # `BuildContext` across an await is only safe behind a `mounted` check.
    use_build_context_synchronously: true

    # --- Correctness -------------------------------------------------------
    always_declare_return_types: true
    no_adjacent_strings_in_list: true
    throw_in_finally: true
    unnecessary_await_in_return: true
    avoid_empty_else: true

    # Deliberately NOT enabled: `avoid_slow_async_io`. It is written for CLI
    # tools. Async `dart:io` dispatches to a thread pool; the `…Sync` variants
    # it recommends block the isolate. In a UI app that walks a media library,
    # blocking is the worse failure — jank the user sees, versus microseconds
    # they do not.

    # --- Consistency -------------------------------------------------------
    prefer_final_locals: true
    prefer_single_quotes: true
    directives_ordering: true
    require_trailing_commas: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
