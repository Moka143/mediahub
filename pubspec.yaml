name: mediahub
description: "MediaHub — a cross-platform Flutter desktop media client."
publish_to: 'none'

version: 0.8.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for API calls
  dio: ^5.9.0
  
  # State management
  flutter_riverpod: ^3.2.0
  
  # Local storage
  shared_preferences: ^2.5.4
  
  # File operations
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  
  # Process management for qBittorrent
  process_run: ^1.2.4
  
  # URL handling
  url_launcher: ^6.3.2
  
  # Window management for desktop
  window_manager: ^0.5.1
  
  # Date/time formatting
  intl: ^0.20.2
  
  # Cached network images for posters
  cached_network_image: ^3.4.1

  # Editorial typography — Instrument Serif (display, italic),
  # Geist (UI), JetBrains Mono (technical data). Loaded on demand
  # from Google Fonts with on-disk caching.
  google_fonts: ^8.0.2

  # Cross-platform video player with libmpv backend (all codecs)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # File system watcher for detecting new downloads
  watcher: ^1.1.0

  # Crypto for file hashing
  crypto: ^3.0.3

  # Cross-platform path joining (Windows/macOS/Linux)
  path: ^1.9.0

  # Algorithm helpers (firstWhereOrNull, etc.) — used directly in streaming/media code
  collection: ^1.19.0
  flutter_secure_storage: ^10.3.1

  # Display geometry, so saved window bounds can be checked against the
  # screens that are actually attached. Already present transitively via
  # window_manager; declared here because main.dart imports it directly.
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the real platform secret backend (DPAPI/Keychain/libsecret),
  # which the fake-backend unit tests cannot reach.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

  # Virtual clock for timer-driven tests (PollLoop). A transitive dep of
  # flutter_test, declared explicitly because tests import it directly.
  fake_async: ^1.3.3

  # Windows MSIX installer generator
  msix: ^3.16.8

msix_config:
  display_name: MediaHub
  publisher_display_name: MediaHub
  identity_name: com.mediahub.desktop
  publisher: CN=MediaHub
  msix_version: 0.8.0.0
  logo_path: assets\icon.png
  # Deliberately no `unvirtualizedResources` here. MSIX redirects %APPDATA%
  # into the package container, so the installer build keeps a different
  # profile from the portable build — measured: a packaged process cannot
  # read, or even list, the portable %APPDATA%\MediaHub\MediaHub, so the two
  # never see each other and nothing migrates between them.
  #
  # `unvirtualizedResources` looks like the fix and is not: it is only the
  # permission. The switch is <desktop6:FileSystemWriteVirtualization>, which
  # the msix package cannot emit and offers no hook to inject. Declaring the
  # capability alone changes nothing (verified) while making the package
  # ineligible for Store submission without Microsoft's approval.
  #
  # So the split stands, which is also how MSIX is meant to work — it is what
  # makes uninstall leave nothing behind. It costs a one-time re-entry of
  # settings and the three credentials for anyone moving from the portable
  # zip to the installer. Upgrades within either channel are unaffected.
  capabilities: internetClient, privateNetworkClientServer
  architecture: x64
  output_path: build\windows\msix
  output_name: mediahub
  store: false

flutter_icons:
  android: false
  ios: false
  image_path: "assets/icon.png"
  windows:
    generate: true
  macos:
    generate: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/icon.png
    # Geist, Instrument Serif and JetBrains Mono, bundled so google_fonts
    # finds them locally (it matches `<Family>-<Variant>.ttf` asset names)
    # instead of fetching them on first launch — an offline first launch used
    # to render fallback fonts, which also threw off every text-metric
    # calculation. Weights not bundled are still fetched on demand. OFL.txt
    # carries the licence the fonts ship under.
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
