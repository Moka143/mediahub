name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# See windows-build.yml — opts every JS action into Node.js 24 ahead of
# GitHub's June 2026 forced-migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      # Fatal on warnings and infos. The lint set in analysis_options.yaml is
      # deliberately stricter than flutter_lints (async lifecycle rules in
      # particular), and it only holds the line if CI enforces it.
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
