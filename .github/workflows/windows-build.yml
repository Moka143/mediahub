name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Belt-and-braces opt-in to Node.js 24 for any JavaScript action that
# still bundles Node 20 internally. GitHub will force-flip this default
# on June 2, 2026; setting it now removes the runtime-deprecation
# annotation and protects against any laggard action publisher.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Run integration tests (real platform secret backend)
        # `flutter test` above only collects test/, and every secret-store
        # test in there uses a fake backend by design. This suite drives the
        # real Windows one — DPAPI — which is the only thing that can catch a
        # platform accepting a credential write and storing nothing. That is
        # the failure that scrubbed both TMDB tokens, and no fake-backend
        # test can reproduce it.
        #
        # Needs a real windows-latest runner, which is why it lives in this
        # workflow and not the cross-platform one.
        run: flutter test integration_test -d windows

      - name: Build Windows release
        # Releases ship without a bundled TMDB token — each user pastes
        # their own free Read Access Token on first launch. The bundled
        # --dart-define plumbing is still in lib/providers/settings_provider.dart
        # if you ever want to add one; just set the TMDB_READ_ACCESS_TOKEN
        # secret and re-add the --dart-define here.
        run: flutter build windows --release

      - name: Fetch the bundled torrent engine
        # Must run between the Flutter build and every packaging step below.
        # All three channels — the portable zip, the MSIX and the Inno Setup
        # installer — copy the whole Release directory, so dropping the engine
        # in there once covers all of them and there is nothing per-channel to
        # keep in sync.
        #
        # The engine is pinned by version and SHA-256 in the script; a
        # mismatch fails the build rather than shipping an unverified binary.
        run: dart run tool/fetch_engine.dart

      - name: Verify the engine is in the bundle
        shell: pwsh
        # Cheap, but it is the check that catches the failure that matters:
        # a packaging path that quietly ships without the engine looks fine
        # until first launch on a machine with no qBittorrent, where the app
        # has no backend at all.
        run: |
          $engine = "build\windows\x64\runner\Release\rqbit.exe"
          if (-not (Test-Path $engine)) { throw "engine missing from bundle: $engine" }
          Write-Host "engine present: $((Get-Item $engine).Length) bytes"

      - name: Package MSIX installer
        run: dart run msix:create --sign-msix false --install-certificate false

      - name: Build Inno Setup installer
        shell: pwsh
        # The .exe installer is what most people actually want: double-click,
        # Start Menu entry, uninstaller. The MSIX next to it is unsigned and
        # so cannot be installed by double-clicking at all — Windows refuses
        # an unsigned package without a trusted certificate — which leaves
        # the portable zip and this as the only usable downloads.
        #
        # Neither is code-signed, so SmartScreen shows "Windows protected
        # your PC" on first run of a downloaded copy. Removing that needs a
        # purchased certificate; the signing step would go right here.
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }

          # Single source of truth for the version: pubspec.yaml. Taking it
          # from the tag instead would silently produce 0.0.0 on branch runs.
          $raw = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' |
                 Select-Object -First 1
          $version = $raw.Matches[0].Groups[1].Value.Trim().Split('+')[0]
          if (-not $version) { throw "could not read version from pubspec.yaml" }
          Write-Host "Building installer for version $version"

          & $iscc "/DMyAppVersion=$version" windows\installer\mediahub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem build\windows\installer

      - name: Upload unpacked Release build
        uses: actions/upload-artifact@v7
        with:
          name: mediahub-windows-unpacked
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload MSIX installer
        uses: actions/upload-artifact@v7
        with:
          name: mediahub-msix
          path: build/windows/msix/*.msix
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: mediahub-setup
          path: build/windows/installer/*.exe
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSIX
        uses: actions/download-artifact@v8
        with:
          name: mediahub-msix
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: mediahub-setup
          path: release-assets

      - name: Download unpacked Release
        uses: actions/download-artifact@v8
        with:
          name: mediahub-windows-unpacked
          path: unpacked

      - name: Zip portable build
        run: |
          cd unpacked
          zip -rq "../release-assets/mediahub-${GITHUB_REF_NAME}-windows-portable.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
